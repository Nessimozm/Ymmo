<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ymmo — Détail du bien</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #0a0a0a;
      --white:  #fafaf8;
      --gold:   #b8945a;
      --gold-lt:#d4af7a;
      --gray:   #6b6b6b;
      --light:  #f0ede8;
      --border: #e0dbd2;
      --error:  #c0392b;
      --success:#27ae60;
      --serif:  'Cormorant Garamond', Georgia, serif;
      --sans:   'Raleway', sans-serif;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--white); color: var(--black); font-family: var(--sans); font-weight: 300; }

    /* ── NAVBAR ───────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 4rem; height: 80px;
      background: rgba(250,250,248,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo { font-family: var(--serif); font-size: 1.8rem; font-weight: 300; letter-spacing: 0.15em; color: var(--black); text-decoration: none; }
    .nav-logo span { color: var(--gold); }

    .nav-back {
      display: flex; align-items: center; gap: 0.6rem;
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--gray);
      text-decoration: none; transition: color 0.2s;
    }
    .nav-back:hover { color: var(--black); }

    .nav-link {
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--gray);
      text-decoration: none; transition: color 0.2s;
      border: 1px solid var(--border); padding: 0.5rem 1.1rem;
      background: transparent; cursor: pointer; font-family: var(--sans);
    }
    .nav-link:hover { color: var(--black); border-color: var(--black); }

    /* ── GALERIE ──────────────────────────────────── */
    .gallery {
      margin-top: 80px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 340px 180px;
      gap: 3px;
      background: var(--border);
    }

    .gallery-main {
      grid-row: 1 / 3;
      position: relative; overflow: hidden;
      background: var(--light);
      cursor: pointer;
    }

    .gallery-thumb {
      position: relative; overflow: hidden;
      background: var(--light);
      cursor: pointer;
    }

    .gallery-main img,
    .gallery-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .gallery-main:hover img,
    .gallery-thumb:hover img { transform: scale(1.04); }

    .gallery-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: var(--light);
    }

    .gallery-placeholder svg { opacity: 0.15; }

    .gallery-count {
      position: absolute; bottom: 1rem; right: 1rem;
      background: rgba(0,0,0,0.7);
      color: var(--white); font-size: 0.65rem;
      font-weight: 500; letter-spacing: 0.1em;
      padding: 0.4rem 0.8rem;
    }

    /* ── LAYOUT PRINCIPAL ────────────────────────── */
    .container {
      max-width: 1300px; margin: 0 auto;
      padding: 4rem;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 5rem;
      align-items: start;
    }

    /* ── COLONNE GAUCHE ───────────────────────────── */
    .property-header { margin-bottom: 3rem; }

    .property-badges {
      display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
    }

    .badge {
      font-size: 0.6rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.3rem 0.8rem;
    }

    .badge-transaction { background: var(--black); color: var(--white); }
    .badge-type        { background: var(--light); color: var(--gray); border: 1px solid var(--border); }
    .badge-status-available { background: #edfaf2; color: var(--success); border: 1px solid #b7eacb; }
    .badge-status-pending   { background: #fef9e7; color: #d68910;       border: 1px solid #fdeaa7; }
    .badge-status-sold      { background: #fdf0ef; color: var(--error);   border: 1px solid #f5b7b1; }

    .property-price {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      font-weight: 300; line-height: 1;
      color: var(--black); margin-bottom: 0.5rem;
    }

    .property-price-per-m2 {
      font-size: 0.75rem; color: var(--gray); letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .property-title {
      font-family: var(--serif);
      font-size: 1.6rem; font-weight: 400;
      color: var(--black); margin-bottom: 0.5rem;
    }

    .property-location {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; color: var(--gray);
    }

    /* ── SPECS ────────────────────────────────────── */
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border: 1px solid var(--border);
      margin: 2.5rem 0;
    }

    .spec-item {
      padding: 1.5rem;
      border-right: 1px solid var(--border);
      text-align: center;
    }

    .spec-item:last-child { border-right: none; }

    .spec-icon { font-size: 1.3rem; margin-bottom: 0.5rem; }

    .spec-value {
      font-family: var(--serif);
      font-size: 1.6rem; font-weight: 300;
      color: var(--black); line-height: 1;
    }

    .spec-label {
      font-size: 0.6rem; font-weight: 500;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gold); margin-top: 0.3rem;
    }

    /* ── DESCRIPTION ──────────────────────────────── */
    .section-title-sm {
      font-family: var(--serif);
      font-size: 1.4rem; font-weight: 400;
      color: var(--black); margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    .description {
      font-size: 0.85rem; line-height: 1.9;
      color: var(--gray); margin-bottom: 3rem;
    }

    /* ── CARACTÉRISTIQUES ─────────────────────────── */
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 3rem;
    }

    .feature-item {
      display: flex; align-items: center; gap: 0.8rem;
      font-size: 0.78rem; color: var(--gray);
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }

    .feature-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--gold); flex-shrink: 0;
    }

    /* ── COLONNE DROITE (sticky) ──────────────────── */
    .sidebar { position: sticky; top: 100px; }

    .contact-card {
      border: 1px solid var(--border);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .contact-card-title {
      font-family: var(--serif);
      font-size: 1.2rem; font-weight: 400;
      color: var(--black); margin-bottom: 0.4rem;
    }

    .contact-card-sub {
      font-size: 0.7rem; color: var(--gray);
      letter-spacing: 0.05em; margin-bottom: 1.5rem;
    }

    .agent-info {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .agent-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--light);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 1.2rem;
      color: var(--gold); flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .agent-name {
      font-size: 0.85rem; font-weight: 500; color: var(--black);
    }

    .agent-role {
      font-size: 0.65rem; color: var(--gray);
      letter-spacing: 0.1em; text-transform: uppercase;
    }

    .contact-form { display: flex; flex-direction: column; gap: 1rem; }

    .field-sm { display: flex; flex-direction: column; gap: 0.3rem; }

    .field-sm label {
      font-size: 0.58rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold);
    }

    .field-sm input,
    .field-sm textarea {
      font-family: var(--sans); font-size: 0.8rem; font-weight: 300;
      padding: 0.7rem 0;
      border: none; border-bottom: 1px solid var(--border);
      background: transparent; color: var(--black); outline: none;
      transition: border-color 0.2s; resize: none;
    }

    .field-sm input:focus,
    .field-sm textarea:focus { border-bottom-color: var(--black); }
    .field-sm input::placeholder,
    .field-sm textarea::placeholder { color: #ccc; }

    .btn-contact {
      font-family: var(--sans); font-size: 0.7rem;
      font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 1rem; border: 1px solid var(--black);
      background: var(--black); color: var(--white);
      cursor: pointer; transition: all 0.25s; margin-top: 0.5rem;
    }
    .btn-contact:hover { background: var(--gold); border-color: var(--gold); }
    .btn-contact:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg-contact {
      font-size: 0.72rem; padding: 0.7rem 1rem; display: none;
    }
    .msg-contact.success { background: #edfaf2; color: var(--success); border-left: 3px solid var(--success); display: block; }
    .msg-contact.error   { background: #fdf0ef; color: var(--error);   border-left: 3px solid var(--error);   display: block; }

    /* Carte infos rapides */
    .info-card {
      border: 1px solid var(--border);
      padding: 1.5rem;
    }

    .info-row {
      display: flex; justify-content: space-between;
      align-items: center; padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
    }

    .info-row:last-child { border-bottom: none; }
    .info-row-label { color: var(--gray); }
    .info-row-value { font-weight: 500; color: var(--black); }

    /* ── BIENS SIMILAIRES ─────────────────────────── */
    .similar-section {
      background: var(--light);
      padding: 5rem 4rem;
    }

    .similar-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 2.5rem;
    }

    .similar-title {
      font-family: var(--serif);
      font-size: 2rem; font-weight: 300;
    }

    .similar-link {
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gray); text-decoration: none;
      transition: color 0.2s;
    }
    .similar-link:hover { color: var(--black); }

    .similar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .similar-card {
      background: var(--white); cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.3s;
    }
    .similar-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.06); }

    .similar-img {
      width: 100%; height: 180px;
      background: var(--light); overflow: hidden;
    }
    .similar-img img { width: 100%; height: 100%; object-fit: cover; }

    .similar-body { padding: 1.2rem; }

    .similar-price {
      font-family: var(--serif);
      font-size: 1.3rem; font-weight: 400;
      margin-bottom: 0.3rem;
    }

    .similar-info { font-size: 0.72rem; color: var(--gray); }

    /* ── FOOTER ──────────────────────────────────── */
    footer {
      background: var(--black);
      padding: 2rem 4rem;
      display: flex; justify-content: space-between; align-items: center;
    }

    .footer-logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 300; letter-spacing: 0.15em; color: var(--white); }
    .footer-logo span { color: var(--gold); }
    .footer-copy { font-size: 0.65rem; color: #555; letter-spacing: 0.1em; }

    /* ── LOADING ──────────────────────────────────── */
    .loading {
      min-height: 60vh; display: flex;
      align-items: center; justify-content: center;
    }
    .loading p {
      font-family: var(--serif); font-size: 1.5rem;
      font-weight: 300; color: var(--gray); font-style: italic;
    }

    /* ── RESPONSIVE ───────────────────────────────── */
    @media (max-width: 1024px) {
      .container { grid-template-columns: 1fr; gap: 3rem; }
      .sidebar { position: static; }
      .gallery { grid-template-rows: 280px 140px; }
    }

    @media (max-width: 768px) {
      nav { padding: 0 1.5rem; }
      .gallery { grid-template-columns: 1fr; grid-template-rows: 260px; }
      .gallery-thumb { display: none; }
      .gallery-main { grid-row: 1; }
      .container, .similar-section { padding: 2rem 1.5rem; }
      .specs-grid { grid-template-columns: 1fr 1fr; }
      .features-grid { grid-template-columns: 1fr; }
      .similar-grid { grid-template-columns: 1fr; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a href="index.html" class="nav-logo">YM<span>M</span>O</a>
  <div style="display:flex; align-items:center; gap:1.5rem;">
    <a href="properties.html" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Retour aux biens
    </a>
    <div id="nav-actions" style="display:flex; align-items:center; gap:0.8rem;"></div>
  </div>
</nav>

<!-- CONTENU DYNAMIQUE -->
<div id="app">
  <div class="loading"><p>Chargement du bien…</p></div>
</div>

<script>
  const API = 'http://localhost:8081/api/v1';

  // ── Utilitaires ─────────────────────────────────
  function getPropertyId() {
    return new URLSearchParams(window.location.search).get('id');
  }

  function getToken() {
    return sessionStorage.getItem('ymmo_token');
  }

  function getUser() {
    const u = sessionStorage.getItem('ymmo_user');
    return u ? JSON.parse(u) : null;
  }

  function formatPrice(price, transaction) {
    const f = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(price);
    return transaction === 'rental' ? f + ' / mois' : f;
  }

  function formatPricePerM2(price, surface) {
    if (!surface || surface === 0) return '';
    const pm2 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(price / surface);
    return `soit ${pm2} / m²`;
  }

  function typeLabel(type) {
    return { apartment: 'Appartement', house: 'Maison', office: 'Bureau', commercial: 'Local commercial', land: 'Terrain' }[type] || type;
  }

  function transactionLabel(t) {
    return t === 'sale' ? 'Vente' : 'Location';
  }

  function statusLabel(s) {
    return { available: 'Disponible', sold: 'Vendu', rented: 'Loué', pending: 'Sous compromis' }[s] || s;
  }

  function statusClass(s) {
    return { available: 'badge-status-available', sold: 'badge-status-sold', pending: 'badge-status-pending', rented: 'badge-status-sold' }[s] || '';
  }

  function agentInitials(agent) {
    if (!agent) return 'A';
    return (agent.first_name?.[0] || '') + (agent.last_name?.[0] || '');
  }

  // ── Rendu principal ─────────────────────────────
  function renderProperty(p) {
    const user  = getUser();
    const token = getToken();

    // Galerie
    const mainImg = p.images && p.images.length > 0
            ? `<img src="http://localhost:8081${p.images[0].url}" alt="${p.title}"/>`
            : `<div class="gallery-placeholder"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9l4-4 4 4 4-4 4 4"/><circle cx="8.5" cy="13.5" r="1.5"/></svg></div>`;

    const thumb1 = p.images && p.images.length > 1
            ? `<img src="http://localhost:8081${p.images[1].url}" alt=""/>`
            : `<div class="gallery-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>`;

    const thumb2 = p.images && p.images.length > 2
            ? `<img src="http://localhost:8081${p.images[2].url}" alt=""/>`
            : `<div class="gallery-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>`;

    // Formulaire de contact (si connecté)
    const contactForm = token
            ? `
          <div class="contact-form">
            <div class="field-sm">
              <label>Votre message</label>
              <textarea id="contact-msg" rows="4" placeholder="Bonjour, je suis intéressé par ce bien et souhaiterais obtenir plus d'informations…"></textarea>
            </div>
            <div class="msg-contact" id="contact-feedback"></div>
            <button class="btn-contact" onclick="sendContact(${p.id})">Envoyer le message</button>
          </div>`
            : `
          <p style="font-size:0.75rem;color:var(--gray);text-align:center;padding:1rem 0">
            <a href="login.html" style="color:var(--black);font-weight:500">Connectez-vous</a>
            pour contacter l'agent
          </p>`;

    document.getElementById('app').innerHTML = `

        <!-- GALERIE -->
        <div class="gallery">
          <div class="gallery-main">
            ${mainImg}
            ${p.images && p.images.length > 0 ? `<div class="gallery-count">📷 ${p.images.length} photo${p.images.length > 1 ? 's' : ''}</div>` : ''}
          </div>
          <div class="gallery-thumb">${thumb1}</div>
          <div class="gallery-thumb">${thumb2}</div>
        </div>

        <!-- CONTENU -->
        <div class="container">

          <!-- COLONNE GAUCHE -->
          <div class="property-main">

            <div class="property-header">
              <div class="property-badges">
                <span class="badge badge-transaction">${transactionLabel(p.transaction)}</span>
                <span class="badge badge-type">${typeLabel(p.type)}</span>
                <span class="badge ${statusClass(p.status)}">${statusLabel(p.status)}</span>
              </div>
              <div class="property-price">${formatPrice(p.price, p.transaction)}</div>
              <div class="property-price-per-m2">${formatPricePerM2(p.price, p.surface)}</div>
              <h1 class="property-title">${p.title}</h1>
              <div class="property-location">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
                ${p.address}, ${p.city} ${p.zip_code}
              </div>
            </div>

            <!-- SPECS -->
            <div class="specs-grid">
              <div class="spec-item">
                <div class="spec-icon">📐</div>
                <div class="spec-value">${p.surface}</div>
                <div class="spec-label">m² surface</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon">🏠</div>
                <div class="spec-value">${p.rooms}</div>
                <div class="spec-label">pièces</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon">🛏</div>
                <div class="spec-value">${p.bedrooms || '—'}</div>
                <div class="spec-label">chambres</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon">👁</div>
                <div class="spec-value">${p.view_count}</div>
                <div class="spec-label">vues</div>
              </div>
            </div>

            <!-- DESCRIPTION -->
            <h2 class="section-title-sm">Description</h2>
            <p class="description">${p.description || 'Aucune description disponible.'}</p>

            <!-- CARACTÉRISTIQUES -->
            <h2 class="section-title-sm">Caractéristiques</h2>
            <div class="features-grid">
              <div class="feature-item"><div class="feature-dot"></div>Type : ${typeLabel(p.type)}</div>
              <div class="feature-item"><div class="feature-dot"></div>Transaction : ${transactionLabel(p.transaction)}</div>
              <div class="feature-item"><div class="feature-dot"></div>Surface : ${p.surface} m²</div>
              <div class="feature-item"><div class="feature-dot"></div>Pièces : ${p.rooms}</div>
              ${p.bedrooms ? `<div class="feature-item"><div class="feature-dot"></div>Chambres : ${p.bedrooms}</div>` : ''}
              <div class="feature-item"><div class="feature-dot"></div>Ville : ${p.city}</div>
              <div class="feature-item"><div class="feature-dot"></div>Code postal : ${p.zip_code}</div>
              <div class="feature-item"><div class="feature-dot"></div>Statut : ${statusLabel(p.status)}</div>
            </div>

          </div>

          <!-- SIDEBAR -->
          <div class="sidebar">

            <!-- CONTACT -->
            <div class="contact-card">
              <div class="contact-card-title">Contacter l'agent</div>
              <div class="contact-card-sub">Réponse sous 24h garantie</div>

              ${p.agent ? `
              <div class="agent-info">
                <div class="agent-avatar">${agentInitials(p.agent)}</div>
                <div>
                  <div class="agent-name">${p.agent.first_name || ''} ${p.agent.last_name || ''}</div>
                  <div class="agent-role">Agent immobilier</div>
                </div>
              </div>` : ''}

              ${contactForm}
            </div>

            <!-- INFOS RAPIDES -->
            <div class="info-card">
              <div class="info-row">
                <span class="info-row-label">Référence</span>
                <span class="info-row-value">#${String(p.id).padStart(5, '0')}</span>
              </div>
              <div class="info-row">
                <span class="info-row-label">Publié le</span>
                <span class="info-row-value">${new Date(p.created_at).toLocaleDateString('fr-FR')}</span>
              </div>
              <div class="info-row">
                <span class="info-row-label">Ville</span>
                <span class="info-row-value">${p.city}</span>
              </div>
              <div class="info-row">
                <span class="info-row-label">Prix au m²</span>
                <span class="info-row-value">${p.surface ? new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(p.price / p.surface) : '—'}</span>
              </div>
            </div>

          </div>
        </div>

        <!-- BIENS SIMILAIRES -->
        <div class="similar-section" id="similar-section">
          <div class="similar-header">
            <h2 class="similar-title">Biens similaires</h2>
            <a href="properties.html" class="similar-link">Voir tous les biens →</a>
          </div>
          <div class="similar-grid" id="similar-grid">
            <div style="grid-column:1/-1;text-align:center;padding:2rem;font-family:var(--serif);color:var(--gray);font-style:italic">
              Chargement…
            </div>
          </div>
        </div>

        <!-- FOOTER -->
        <footer>
          <div class="footer-logo">YM<span>M</span>O</div>
          <p class="footer-copy">© 2024 Ymmo Groupe Immobilier · Tous droits réservés</p>
        </footer>
      `;

    // Met à jour le titre de la page
    document.title = `Ymmo — ${p.title}`;

    // Charge les biens similaires
    loadSimilar(p.city, p.type, p.id);
  }

  // ── Contact agent ───────────────────────────────
  async function sendContact(propertyId) {
    const msg   = document.getElementById('contact-msg').value.trim();
    const btn   = document.querySelector('.btn-contact');
    const fb    = document.getElementById('contact-feedback');

    if (!msg || msg.length < 10) {
      fb.className = 'msg-contact error';
      fb.textContent = 'Veuillez écrire un message d\'au moins 10 caractères.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Envoi…';
    fb.className = 'msg-contact';

    try {
      const res = await fetch(`${API}/properties/${propertyId}/contact`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${getToken()}`
        },
        body: JSON.stringify({ message: msg })
      });

      if (res.ok) {
        fb.className = 'msg-contact success';
        fb.textContent = 'Message envoyé ! L\'agent vous répondra sous 24h.';
        document.getElementById('contact-msg').value = '';
      } else {
        const data = await res.json();
        fb.className = 'msg-contact error';
        fb.textContent = data.error || 'Une erreur est survenue.';
      }
    } catch {
      fb.className = 'msg-contact error';
      fb.textContent = 'Erreur de connexion au serveur.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Envoyer le message';
    }
  }

  // ── Biens similaires ────────────────────────────
  async function loadSimilar(city, type, excludeId) {
    try {
      const res  = await fetch(`${API}/properties?city=${city}&type=${type}&limit=3`);
      const data = await res.json();
      const grid = document.getElementById('similar-grid');
      if (!grid) return;

      const items = (data.data || []).filter(p => p.id !== excludeId).slice(0, 3);

      if (items.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;font-family:var(--serif);color:var(--gray);font-style:italic">Aucun bien similaire trouvé</div>';
        return;
      }

      grid.innerHTML = items.map(p => `
          <div class="similar-card" onclick="window.location='property.html?id=${p.id}'">
            <div class="similar-img">
              ${p.images && p.images.length > 0
              ? `<img src="http://localhost:8081${p.images[0].url}" alt="${p.title}"/>`
              : `<div class="gallery-placeholder" style="height:100%"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>`
      }
            </div>
            <div class="similar-body">
              <div class="similar-price">${formatPrice(p.price, p.transaction)}</div>
              <div class="similar-info">${p.title} · ${p.city}</div>
            </div>
          </div>
        `).join('');
    } catch {}
  }

  // ── Navigation dynamique selon l'état de connexion ──
  function logout() {
    sessionStorage.removeItem('ymmo_token');
    sessionStorage.removeItem('ymmo_user');
    window.location.reload();
  }

  function renderNav() {
    const user = getUser();
    const actions = document.getElementById('nav-actions');

    if (!user) {
      actions.innerHTML = '<a href="login.html" class="nav-link">Connexion</a>';
      return;
    }

    let html = '<a href="messages.html" class="nav-link">Mes messages</a>';
    if (user.role === 'agent' || user.role === 'admin') {
      html += '<a href="dashboard.html" class="nav-link">Dashboard</a>';
    }
    html += '<button class="nav-link" onclick="logout()">Déconnexion</button>';
    actions.innerHTML = html;
  }

  // ── Init ────────────────────────────────────────
  async function init() {
    renderNav();

    const id = getPropertyId();
    if (!id) {
      window.location.href = 'properties.html';
      return;
    }

    try {
      const res = await fetch(`${API}/properties/${id}`);
      if (!res.ok) {
        window.location.href = 'properties.html';
        return;
      }
      const property = await res.json();
      renderProperty(property);
    } catch {
      document.getElementById('app').innerHTML =
              '<div class="loading"><p>Erreur de chargement du bien</p></div>';
    }
  }

  init();
</script>
</body>
</html>
